name: Backfill 00992A History

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD"
        required: true
        type: string
      end:
        description: "End date YYYY-MM-DD"
        required: true
        type: string
      max_days:
        description: "Safety limit for date count"
        required: false
        default: "5"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Backfill 00992A history
        run: |
          python backfill_00992a_datepicker.py \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}" \
            --max-days "${{ github.event.inputs.max_days }}"

      - name: Commit backfilled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/out
          git commit -m "Backfill 00992A holdings ${{ github.event.inputs.start }} to ${{ github.event.inputs.end }}" || echo "No changes to commit"
          git push
